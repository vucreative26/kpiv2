<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <title>Flow KPI V3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260921">
</head>
<body>
  <section id="auth" class="auth-shell">
    <form id="loginForm" class="auth-card">
      <div class="brand-mark">F</div>
      <div><h1>Flow KPI</h1><p>Biến mục tiêu thành kế hoạch rõ ràng.</p></div>
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Đăng nhập</button>
      <button id="demoLogin" class="btn ghost wide" type="button">Xem bản demo</button>
      <small id="authMessage" role="status"></small>
    </form>
  </section>

  <div id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">F</div><div><b>Flow KPI</b><small>Personal workspace</small></div></div>
      <nav id="mainNav">
        <button data-view="dashboard"><span>⌂</span>Dashboard</button>
        <button data-view="kpi"><span>◎</span>KPI</button>
        <button data-view="planning"><span>▦</span>Kế hoạch</button>
        <button data-view="payroll"><span>₫</span>Lương & Chấm công</button>
        <button data-view="reports"><span>≡</span>Báo cáo</button>
      </nav>
      <div class="side-secondary">
        <button data-view="backup"><span>⇩</span>Xuất dữ liệu</button>
        <button data-view="settings"><span>⚙</span>Cài đặt</button>
      </div>
      <footer><button id="logoutButton">Đăng xuất</button></footer>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button id="menuButton" class="icon-btn menu" aria-label="Mở menu">☰</button>
        <div><p id="eyebrow">FLOW KPI</p><h1 id="pageTitle">Dashboard</h1></div>
        <div class="month-switch"><button id="prevMonth" aria-label="Tháng trước">‹</button><input id="period" type="month"><button id="nextMonth" aria-label="Tháng sau">›</button></div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="./src/app.js?v=20260921"></script>
</body>
</html>
