<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <title>Flow KPI V3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260921-urgentfab5">
</head>
<body>
  <section id="auth" class="auth-shell">
    <form id="loginForm" class="auth-card">
      <div class="brand-mark">F</div>
      <div><h1>Flow KPI</h1><p>Biến mục tiêu thành kế hoạch rõ ràng.</p></div>
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Đăng nhập</button>
      <button id="demoLogin" class="btn ghost wide" type="button">Xem bản demo</button>
      <small id="authMessage" role="status"></small>
    </form>
  </section>

  <div id="app" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">F</div><div><b>Flow KPI</b><small>Personal workspace</small></div></div>
      <nav id="mainNav">
        <button data-view="dashboard" title="Dashboard"><span class="nav-icon" style="--icon: url('./assets/icons/dashboard.svg')"></span><span class="nav-label">Dashboard</span></button>
        <button data-view="kpi" title="KPI"><span class="nav-icon" style="--icon: url('./assets/icons/kpi.svg')"></span><span class="nav-label">KPI</span></button>
        <button data-view="planning" title="Kế hoạch"><span class="nav-icon" style="--icon: url('./assets/icons/planning.svg')"></span><span class="nav-label">Kế hoạch</span></button>
        <button data-view="payroll" title="Lương & Chấm công"><span class="nav-icon" style="--icon: url('./assets/icons/payroll.svg')"></span><span class="nav-label">Lương & Chấm công</span></button>
        <button data-view="reports" title="Báo cáo"><span class="nav-icon" style="--icon: url('./assets/icons/reports.svg')"></span><span class="nav-label">Báo cáo</span></button>
      </nav>
      <div class="side-secondary">
        <button data-view="backup" title="Xuất dữ liệu"><span class="nav-icon" style="--icon: url('./assets/icons/backup.svg')"></span><span class="nav-label">Xuất dữ liệu</span></button>
        <button data-view="settings" title="Cài đặt"><span class="nav-icon" style="--icon: url('./assets/icons/settings.svg')"></span><span class="nav-label">Cài đặt</span></button>
      </div>
      <footer><button id="logoutButton"><span class="nav-icon" style="--icon: url('./assets/icons/logout.svg')"></span><span class="nav-label">Đăng xuất</span></button></footer>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button id="menuButton" class="icon-btn menu" aria-label="Mở menu"><span class="svg-icon" style="--icon: url('./assets/icons/menu.svg')"></span></button>
        <div><p id="eyebrow">FLOW KPI</p><h1 id="pageTitle">Dashboard</h1></div>
        <div class="month-switch"><button id="prevMonth" aria-label="Tháng trước"><span class="svg-icon" style="--icon: url('./assets/icons/chevron-left.svg')"></span></button><input id="period" type="month"><button id="nextMonth" aria-label="Tháng sau"><span class="svg-icon" style="--icon: url('./assets/icons/chevron-right.svg')"></span></button></div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
    <button id="floatingUrgent" class="floating-urgent" type="button" aria-label="Thêm việc gấp" title="Kéo để di chuyển · Bấm để thêm việc gấp">
      <span>+</span><b>Gấp</b>
    </button>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="./src/app.js?v=20260921-urgentfab5"></script>
</body>
</html>
